name = "LowRankUnivariateSOS"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LowRankUnivariateSOS"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "LowRankUnivariateSOS"
# The library root is `LowRankUnivariateSOS.lean`. The two root-level modules
# `Challenge` (Palomar statement surface, `sorry` proofs) and `Solution`
# (imports the proof development) are built with the library so that
# `lake build Challenge` / `lake build Solution` work for Comparator, but they
# are deliberately not library roots: tools that import every root into one
# environment (e.g. `checkdecls`) would otherwise see the statement-level
# definitions twice.
globs = ["LowRankUnivariateSOS", "Challenge", "Solution"]
